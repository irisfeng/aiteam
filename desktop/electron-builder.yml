appId: im.aiteam.desktop
productName: AiTeam
icon: assets/app-icon.svg
directories:
  output: release
asar: true
files:
  - main.cjs
  - preload.cjs
  - connect-preload.cjs
  - package.json
extraResources:
  - from: .runtime/server
    to: server
    filter:
      - dist/**/*
      - package.json
  - from: .runtime/server/node_modules
    to: server/node_modules
    filter:
      - "**/*"
  - from: .runtime/node
    to: node
    filter:
      - "**/*"
  - from: .runtime/web
    to: web
    filter:
      - dist/**/*
# mac 出 dmg + zip 双产物：dmg 给用户装，zip 给自动更新/CI 校验用；alpha 阶段不签名不公证。
mac:
  identity: null
  category: public.app-category.productivity
  target:
    - dmg
    - zip
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
win:
  target:
    - dir
linux:
  target:
    - dir
